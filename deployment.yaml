apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-portal
  labels:
    app: lms-portal
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: lms-portal
  template:
    metadata:
      labels:
        app: lms-portal
    spec:
      containers:
        - name: lms-portal
          image: afif729/university-lms-portal:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
